<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stadtrallye Alt-Schwabing – Weihnachtsfeier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kaushan+Script&family=Fira+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --lime:#c3d600; --lime-ink:#8a9a00; --lime-soft:#eef3c8;
  --navy:#00375f; --ink:#3d3d3d; --muted:#6b6b6b; --line:#d9d9d9;
  --bg:#ffffff; --surface:#ffffff; --panel:#f4f4f4;
  --ok:#5a8a00; --bad:#c0392b; --bad-soft:#fdecea;
  --script:"Kaushan Script","Brush Script MT","Segoe Script",cursive;
  --sans:"Fira Sans","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --lime:#c9dc1a; --lime-ink:#c9dc1a; --lime-soft:#2a3108;
    --navy:#9cc3e6; --ink:#e8e8e8; --muted:#a8a8a8; --line:#3a3a3a;
    --bg:#141618; --surface:#1d2023; --panel:#24282c;
    --ok:#a6d43a; --bad:#ff7b6b; --bad-soft:#3a1d1a;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --lime:#c9dc1a; --lime-ink:#c9dc1a; --lime-soft:#2a3108;
  --navy:#9cc3e6; --ink:#e8e8e8; --muted:#a8a8a8; --line:#3a3a3a;
  --bg:#141618; --surface:#1d2023; --panel:#24282c;
  --ok:#a6d43a; --bad:#ff7b6b; --bad-soft:#3a1d1a;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
img{max-width:100%;display:block}
.wrap{max-width:620px;margin:0 auto;padding:0 20px 48px}

/* Kopfleiste */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#00375f;color:#fff}
.bar-in{max-width:620px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.bar .team{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .pts{background:#c3d600;color:#00375f;font-weight:700;border-radius:999px;padding:3px 12px;white-space:nowrap}
.bar .right{display:flex;gap:8px;align-items:center}
.bar .clock{font-weight:700;font-variant-numeric:tabular-nums;border:2px solid #c3d600;border-radius:999px;padding:1px 10px;white-space:nowrap}
.bar .clock.warn{background:#c0392b;border-color:#c0392b}
.progress{height:4px;background:rgba(255,255,255,.2)}
.progress>i{display:block;height:100%;background:#c3d600;transition:width .4s ease}

/* Überschriften im Rallye-Stil */
.script{font-family:var(--script);color:var(--lime);font-weight:400;line-height:1;margin:28px 0 6px;font-size:clamp(44px,13vw,72px);letter-spacing:-.01em;transform:rotate(-3deg);transform-origin:left bottom}
.script.small{font-size:clamp(34px,9vw,48px);margin-top:22px}
.sub{font-size:13px;color:var(--muted);margin:0 0 14px}
.intro{margin:12px 0 18px;white-space:pre-line}
.figure{margin:14px 0 20px;border-radius:2px;overflow:hidden}
details.again{margin:8px 0 16px;color:var(--muted);font-size:15px}
details.again summary{cursor:pointer}
.quote{background:var(--lime-soft);padding:16px 18px;margin:16px 0;border-left:6px solid var(--lime)}

/* Fragebox mit Stift */
.qbox{position:relative;border:2px solid var(--lime);background:var(--surface);padding:22px 20px 20px;margin:26px 0 12px}
.pencil{position:absolute;left:-14px;top:-22px;width:30px;height:46px}
.qnum{font-weight:700;margin-right:4px}
.qtext{font-weight:700;margin:0 0 14px;font-size:17px}
.inrow{display:flex;align-items:flex-end;gap:8px}
.prefix{color:var(--muted);padding-bottom:9px}
input[type=text]{flex:1;width:100%;font:inherit;color:var(--ink);background:transparent;border:0;border-bottom:2px dotted var(--muted);padding:8px 2px;border-radius:0}
input[type=text]:focus{outline:none;border-bottom:2px solid var(--lime-ink)}
.hint{font-size:13px;font-weight:600;color:var(--muted);margin-top:6px}
.worth{font-size:14px;color:var(--muted);margin:10px 0 0}
.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.script{transform:none}}

.msg{margin:14px 0 0;padding:12px 14px;font-weight:600}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--lime-soft);color:var(--ok)}

.btn{display:inline-block;font:inherit;font-weight:700;border:0;cursor:pointer;padding:13px 22px;border-radius:999px;background:#c3d600;color:#00375f;margin-top:16px}
.btn:focus-visible,.link:focus-visible,.teamopt:focus-within{outline:3px solid var(--navy);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
.btn.full{width:100%}
.link{background:none;border:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px 0;font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* Start */
.hero{position:relative;margin:0 -20px;background:#00375f;color:#fff;overflow:hidden}
.hero img{width:100%;height:300px;object-fit:cover;opacity:.55}
.hero .t{position:absolute;inset:auto 20px 22px 20px}
.hero .t h1{font-family:var(--script);font-weight:400;color:#c3d600;font-size:clamp(52px,15vw,84px);line-height:.95;margin:0;transform:rotate(-4deg);transform-origin:left bottom}
.hero .t p{margin:12px 0 0;font-size:18px}
.teams{display:grid;gap:10px;margin:14px 0}
.teamopt{display:flex;align-items:center;gap:12px;border:2px solid var(--line);padding:14px 16px;cursor:pointer;background:var(--surface)}
.teamopt input{accent-color:#8a9a00;width:20px;height:20px}
.teamopt.on{border-color:var(--lime)}
.teamopt b{font-size:18px}
label.field{display:block;font-weight:600;margin-top:18px}
.rules{background:var(--panel);padding:14px 18px;margin:20px 0;font-size:15px}
.rules ul{margin:6px 0 0;padding-left:20px}

/* Ende */
.score{font-family:var(--script);color:var(--lime);font-size:96px;line-height:1;margin:10px 0}
table.res{width:100%;border-collapse:collapse;font-size:15px;margin-top:10px}
table.res td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.res td:last-child{text-align:right;font-weight:700}
.navyband{background:#00375f;color:#fff;padding:18px 20px;margin:24px -20px 0}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="bar" class="bar hidden">
  <div class="bar-in"><span class="team" id="barTeam"></span><span class="right"><span class="clock" id="barClock" aria-label="Verbleibende Zeit">60:00</span><span class="pts" id="barPts">0 Punkte</span></span></div>
  <div class="progress"><i id="prog" style="width:0"></i></div>
</div>
<main class="wrap" id="app"></main>

const STATIONS = [{"title": "Unser Spaziergang", "intro": "Er startet in der Feilitzschstraße (benannt nach Maximilian Alexander Freiherr von Feilitzsch, bayerischer Innenminister von 1881–1907). Auf der rechten Straßenseite prangt noch immer der Name „Karstadt“, obwohl das Kaufhaus längst unter „Galeria“ firmiert. Zu Lebzeiten der gesuchten Person gab es noch keine Einkaufsbummel durch Kaufhäuser.", "img": null, "q": [{"id": "1", "text": "Welcher Künstler hatte auf der anderen Straßenseite seinen Arbeitsplatz?", "prefix": "", "hint": "Nachname", "after": "Mal schnell auf einen Sprung zu Edeka wäre damals ebenfalls nicht möglich gewesen. Heute kann man sich hier nicht nur mit Lebensmitteln versorgen, sondern auch einen Blick auf Münchner Sehenswürdigkeiten werfen – wenn auch nicht an der Hausfront.", "h": ["42024d8d168cbe8676d2fccce22273a07fdb50be17528cc6ca0ae1a1a78ccdef", "f5e0dcd6477e18309d062d0b48e17e18c186a7211cc19ef6271bf0a74581fdf3"], "img": null}, {"id": "2", "text": "Wie heißt das mittlere der drei Bauwerke?", "prefix": "", "hint": "", "after": "", "h": ["38dbeed1e3e87ecd54c9e9b90cb0607aa52490e00cfcec76da36e9d0372f6369", "d0b20035081692129edeeb50670f4955848753e0e099b7d707569396d08d121c"], "img": null}]}, {"title": "Weiter geht’s", "intro": "Auf der Feilitzschstraße lässt ein Brillenladen mit Schwabing-Flair eine bekannte Dame der Bohème-Welt zu Wort kommen: Franziska Gräfin zu Reventlow (1871–1918) entschied sich konsequent gegen ein bürgerliches Frauendasein und für ein selbstbestimmtes, freies Leben.", "img": null, "q": [{"id": "3", "text": "Wie definierte Franziska Reventlow Schwabing?", "prefix": "als", "hint": "", "after": "", "h": ["69d06d728c18f3938b14d862da2b4e9426a1feb335316d05eafc9b7a2e32d4a5", "a70a3b9d794adc37bd36ceddc59c4f197bea1d18498d892ea45cde81c596176c", "bd36b70cdc520410ffd42e6c4e7bd5304134b1a0f11773961414724099cd2460", "e9e2506c77898d5a181c017f820bd02327493bdd6e59b04ab8c3f6460b5a6acb"], "img": null}]}, {"title": "Am Marktplatz", "intro": "Sie erreichen den früheren Marktplatz Schwabings. Er ist dem Dramatiker und Schriftsteller Frank Wedekind (1864–1918) gewidmet, der auch als „Bürgerschreck“ bezeichnet wurde. Machen Sie sich auf die Suche nach einem Gedicht.", "img": null, "q": [{"id": "4", "text": "Wessen Launen werden als seltsam bezeichnet?", "prefix": "", "hint": "Hauptwort in der Grundform", "after": "", "h": ["8f732e55051bf1d7c4ce5203a7e85e4f0bce03d0b94b6c516c0e2d619c2e074d", "9424275b8af26b3411e2c40f6ec9460cb86e9bca4cdb682c263af9b821f33a06", "c850ea73ec248831367977901a8c3e218c2dc0adf9522e31769808f1991be29e"], "img": null}, {"id": "5", "text": "Welcher Vorname gehört zu dieser Laterne?", "prefix": "", "hint": "", "after": "Die Dame sang in ihrem Lokal Lieder, die als unmoralisch galten.", "h": ["d9f765d95ebf133d88ca18c78ba9ea3f02fb981f5bf81b7b5f4d65e71886d4d5"], "img": "laterne"}]}, {"title": "Ums Eck", "intro": "Weiter geht es durch die Feilitzschstraße bis zur nächsten rechts abzweigenden Straße. Nach ein paar Schritten entlang der Mauer gibt ein schmiedeeisernes Tor den Blick auf ein hochherrschaftliches Gemäuer frei. Beim schlichten Fußgängereingang erfahren Sie, wer sich dieses Domizil samt prächtigem Park einst geleistet hat.", "img": null, "q": [{"id": "6a", "text": "Welchen Beruf übte dieser Herr aus?", "prefix": "", "hint": "", "after": "", "h": ["0faa758c4b2cef46774ce62674fbccad88444b4cdfa19d0d4d06d1e62492ba85", "1ea9a8ad2da73887a60cfbaca5842db9fdc5813107ef51aeae7f7d231c9dd8ab", "1fe5370c03a1fbeae300fc7f5bd7be0054af9790280365ac350535dbcbcca019", "bf5cb027ea46c1845890dfb6cd70438b62840499942d89a2f0b4d9ce1ffb4b0e"], "img": null}, {"id": "6b", "text": "Wem erteilte er mutmaßlich den Bauauftrag?", "prefix": "", "hint": "Nachname", "after": "", "h": ["2d3258a16fc0819db339636f934b98f93f9f0f38d6b2ed54ceec81fa7e6546b8"], "img": null}]}, {"title": "Machen Sie kehrt", "intro": "… und folgen Sie weiter der Feilitzschstraße. An der Ecke der nächsten rechts abzweigenden Straße hat ein Bauernhof di 59d2db1836d4cdb6b93890fd37c0c16ec00094b06dc422b970e8013328d55e", "749d89d26167271e57822b9bb8a60f1a6dff262ca3881394f09b9649ba3278d1"], "img": null}]}, {"title": "Kreativ verzierte Fenster", "intro": "Kleiner Entdecker-Tipp: Achten Sie auf kreativ verzierte Fenster von Kindern in dieser Straße!", "img": null, "q": [{"id": "17", "text": "Welche afrikanischen Flusstiere haben sich hier im Gebäude niedergelassen?", "prefix": "", "hint": "", "after": "", "h": ["0db84db80f25dfde554ee4b46607684f0417101398203e7668698257cf72f74b", "1761933d1fc0bb7ba734fefa70cd79e299b60e9ef8ddef7358ac357691048cec", "5072610bfe983acec159eff25dfaa684ec607cf79848461374ce2f18cce72fc5", "54d13476ba2440182a90d3a017ae8164dcecdc5fddbff21fd842704253a6bb5d", "6f6fa95de6bcc2f2f07d95eaef8a4755742084b4ab98e6b7c28c96a48820c0db", "88095fd2c22bcd468791b3a68422a30b61e3e6f13ac258e76ad1d88d08068b75"], "img": null}]}, {"title": "Blick schweifen lassen", "intro": "Bevor Sie die Münchner Freiheit erreichen, lassen Sie noch einmal Ihren Blick schweifen.", "img": "relief", "q": [{"id": "18", "text": "An wie viele ehemalige Bewohner wird hier erinnert?", "prefix": "", "hint": "Zahl in Ziffern", "after": "", "h": ["a048c52a107625f028f5760b802a50c204031c5758a4883ee6c02c6838e21300", "ce099b0e5495de086f9bb307c42905585c3d06f753cdab86f3312a86ffef6336"], "img": null}]}, {"title": "Rampe", "intro": "Die heutige Gestaltung erhielt der Platz mit dem U-Bahn-Bau: Die erste Linie U6 startete im Oktober 1971, im Mai 1972 folgte die U3 zum Olympiazentrum. An einer Säule gibt es Informationen zu den Läden im Forum, dem abgesenkten Platzbereich. Gehen Sie dort über die Rampe – schon nach wenigen Schritten findet sich eine Erklärung zu „Münchner Freiheit“.", "img": null, "q": [{"id": "19", "text": "Welche „Aktion“ wird namentlich genannt?", "prefix": "", "hint": "", "after": "", "h": ["1ea022d2b48d189f9e23ece2b349970d569dc742a9c9cf1b7478681019e02840", "793507c1e9f9603ac231cc9e7a13c63b06f36d63bb11d6a5fef3dadd9e18ff0f", "9721424cc61bde749f451ae0265d42f002f044114f2fb5eae69a99536c7aa94a"], "img": null}]}, {"title": "Café", "intro": "Wieder auf Straßenniveau geht es schnurstracks zum Café, das sich nach dem Platz nennt. Dort haben zwei prominente Vertreter des Schwabinger Lebensgefühls einen dauerhaften Stammplatz gefunden: der Schauspieler Helmut Fischer (1926–1997), berühmt als Monaco Franze, und Regisseur Helmut Dietl (1944–2015).", "img": null, "q": [{"id": "20", "text": "Wie viele Eiskugeln hat sich Helmut Fischer bestellt?", "prefix": "", "hint": "Zahl in Ziffern", "after": "", "h": ["3241504cc8bf63140672113d6c34b90061c3e154107d8f962a9985784bb224fb", "a1b88098225a31f768941eafdec72f5c6cbeb0e8bdfd3605145e673e7b67bd2c"], "img": null}]}];
const SALT = "xmas26-schwabing|";
const PIN_HASH = "9120e3cc53878805c420a42aa661822c751bd113b5e9cf70226311a1c968ae9c";
const KEY = "rallye-altschwabing-weihnacht-2026";
const QUESTIONS = [];
STATIONS.forEach((s,si)=>s.q.forEach((q,qi)=>QUESTIONS.push({...q,si,first:qi===0})));
const MAX = QUESTIONS.length*3;
const LIMIT = 60*60*1000;
function elapsed(){return state.started?Date.now()-new Date(state.started).getTime():0}
function timeUp(){return !!state.team && !state.finished && elapsed()>=LIMIT}
function mmss(ms){ms=Math.max(0,ms);const s=Math.floor(ms/1000);const m=Math.floor(s/60),x=s%60;return m+":"+String(x).padStart(2,"0")}
function finish(up){if(state.finished)return;state.timeUp=!!up;state.finished=up?new Date(new Date(state.started).getTime()+LIMIT).toISOString():new Date().toISOString();save()}

const PENCIL = '<svg class="pencil" viewBox="0 0 30 46" aria-hidden="true"><g transform="rotate(-28 15 23)"><rect x="9" y="2" width="12" height="30" rx="3" fill="#c3d600"/><path d="M9 32 L21 32 L15 44 Z" fill="#fff" stroke="#c3d600" stroke-width="1.5"/><path d="M13.6 41 L16.4 41 L15 44 Z" fill="#c3d600"/></g></svg>';

let state = load() || fresh();
function fresh(){return {team:null,idx:0,wrong:{},pts:{},skipped:{},view:"q"}}
function load(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

function norm(s){
  s=(s||"").toLowerCase().replace(/ä/g,"ae").replace(/ö/g,"oe").replace(/ü/g,"ue").replace(/ß/g,"ss");
  s=s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  return s.replace(/[^a-z0-9]/g,"");
}
async function sha(t){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function worth(w){return w===0?3:w===1?2:w<=4?1:0}
function total(){return Object.values(state.pts).reduce((a,b)=>a+b,0)}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function pl(n){return n===1?"1 Punkt":n+" Punkte"}

const app=document.getElementById("app");

function updateBar(){
  const bar=document.getElementById("bar");
  if(!state.team){bar.classList.add("hidden");return}
  bar.classList.remove("hidden");
  document.getElementById("barTeam").textContent=state.team.name;
  document.getElementById("barPts").textContent=pl(total());
  const done=Math.min(state.idx+(state.view==="ok"?1:0),QUESTIONS.length);
  document.getElementById("prog").style.width=(done/QUESTIONS.length*100)+"%";
  updateClock();
}
function updateClock(){
  const c=document.getElementById("barClock");
  if(!state.team||!state.started){return}
  const used=state.finished?new Date(state.finished)-new Date(state.started):elapsed();
  const rest=LIMIT-used;
  c.textContent=state.finished?"Ziel":mmss(rest);
  c.classList.toggle("warn",!state.finished&&rest<=5*60*1000);
}
setInterval(()=>{
  if(!state.team||state.finished) return;
  if(timeUp()){finish(true);render();window.scrollTo(0,0);return}
  updateClock();
},1000);

function render(){
  updateBar();
  if(!state.team) return renderStart();
  if(timeUp()) finish(true);
  if(state.finished || state.idx>=QUESTIONS.length) return renderEnd();
  if(state.view==="ok") return renderOk();
  renderQuestion();
}

/* ---------- Start ---------- */
function renderStart(){
  let sel=1;
  app.innerHTML=`
    <div class="hero"><img src="${IMG.cover}" alt=""><div class="t"><h1>Alt-Schwabing</h1><p>Vom Bauerndorf zur Traumstadt – unsere Weihnachts-Stadtrallye</p></div></div>
    <p style="margin-top:22px"><b>Start &amp; Ende:</b> U-Bahn-/Bus-/Tram-Haltestelle „Münchner Freiheit“</p>
    <h2 class="script small">Euer Team</h2>
    <p class="sub">Wählt eure Teamnummer und gebt euch einen Namen, wenn ihr wollt.</p>
    <div class="teams" role="radiogroup">
      ${[1,2,3].map(n=>`<label class="teamopt${n===1?" on":""}"><input type="radio" name="team" value="${n}"${n===1?" checked":""}><b>Team ${n}</b></label>`).join("")}
    </div>
    <label class="field" for="tname">Teamname (optional)</label>
    <div class="inrow"><input type="text" id="tname" maxlength="30" placeholder="z. B. Die Glühweinjäger" autocomplete="off"></div>
    <div class="rules">
      <b>So funktioniert’s</b>
      <ul>
        <li>Richtig beim 1. Versuch: 3 Punkte</li>
        <li>Richtig beim 2. Versuch: 2 Punkte</li>
        <li>Richtig beim 3. bis 5. Versuch: 1 Punkt</li>
        <li>Ab dem 6. Versuch: 0 Punkte</li>
        <li>Ihr habt 60 Minuten. Die Zeit läuft ab „Rallye starten“. Ist sie abgelaufen, endet die Rallye dort, wo ihr gerade seid.</li>
        <li>Bei Punktgleichstand gewinnt das schnellere Team.</li>
      </ul>
      <p style="margin:10px 0 0">Bei einer falschen Antwort seht ihr nur, dass sie falsch ist – die Lösung wird nie angezeigt. Ist eine Zahl gefragt, schreibt sie in Ziffern. Spielt bitte mit genau einem Handy pro Team.</p>
    </div>
    <button class="btn full" id="go">Rallye starten</button>`;
  app.querySelectorAll('input[name=team]').forEach(r=>r.addEventListener("change",()=>{
    sel=+r.value;
    app.querySelectorAll(".teamopt").forEach(l=>l.classList.toggle("on",l.querySelector("input").checked));
  }));
  document.getElementById("go").onclick=()=>{
    const nm=document.getElementById("tname").value.trim();
    state.team={nr:sel,name:nm?`Team ${sel}: ${nm}`:`Team ${sel}`};
    state.started=new Date().toISOString();
    save();render();window.scrollTo(0,0);
  };
}

/* ---------- Frage ---------- */
function renderQuestion(){
  const q=QUESTIONS[state.idx], s=STATIONS[q.si];
  const w=state.wrong[q.id]||0;
  const introHtml = q.first
    ? `<h2 class="script">${esc(s.title)}</h2>
       <p class="intro">${esc(s.intro)}</p>
       ${s.img?`<div class="figure"><img src="${IMG[s.img]}" alt=""></div>`:""}`
    : `<h2 class="script small">${esc(s.title)}</h2>
       <details class="again"><summary>Stationstext nochmal lesen</summary><p class="intro">${esc(s.intro)}</p></details>`;
  app.innerHTML=`
    ${introHtml}
    ${q.img?`<div class="figure"><img src="${IMG[q.img]}" alt=""></div>`:""}
    <div class="qbox" id="qbox">${PENCIL}
      <p class="qtext"><span class="qnum">${esc(q.id)})</span>${esc(q.text)}</p>
      <form id="f" autocomplete="off">
        <div class="inrow">${q.prefix?`<span class="prefix">${esc(q.prefix)}</span>`:""}<input type="text" id="ans" aria-label="Antwort" enterkeyhint="send" autocapitalize="off" spellcheck="false"></div>
        ${q.hint?`<div class="hint">${esc(q.hint)}</div>`:""}
        <div id="msg"></div>
        <button class="btn" id="send" type="submit">Antwort prüfen</button>
      </form>
      <p class="worth" id="worth">${worthText(w)}</p>
    </div>
    <div class="row"><span class="sub" style="margin:0">Frage ${state.idx+1} von ${QUESTIONS.length}</span>
      <button class="link" id="skip">Frage überspringen (0 Punkte)</button></div>`;
  const inp=document.getElementById("ans");
  document.getElementById("f").onsubmit=async e=>{
    e.preventDefault();
    if(timeUp()){finish(true);render();window.scrollTo(0,0);return}
    const v=norm(inp.value);
    if(!v){inp.focus();return}
    const btn=document.getElementById("send"); btn.disabled=true;
    const h=await sha(SALT+q.id+"|"+v);
    btn.disabled=false;
    if(q.h.includes(h)){
      const wn=state.wrong[q.id]||0;
      state.pts[q.id]=worth(wn); state.view="ok";
      if(state.idx===QUESTIONS.length-1) finish(false);
      save(); render(); window.scrollTo(0,0);
    }else{
      state.wrong[q.id]=(state.wrong[q.id]||0)+1; save();
      const n=state.wrong[q.id];
      document.getElementById("msg").innerHTML=`<p class="msg bad" role="alert">Leider falsch. Versucht es nochmal!</p>`;
      document.getElementById("worth").textContent=worthText(n);
      const box=document.getElementById("qbox"); box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake");
      inp.select();
    }
  };
  document.getElementById("skip").onclick=()=>{
    if(!confirm("Diese Frage wirklich überspringen? Ihr bekommt dafür 0 Punkte und könnt sie später nicht mehr beantworten.")) return;
    if(timeUp()){finish(true);render();window.scrollTo(0,0);return}
    state.pts[q.id]=0; state.skipped[q.id]=true;
    if(state.idx===QUESTIONS.length-1) finish(false);
    state.idx++; state.view="q"; save(); render(); window.scrollTo(0,0);
  };
}
function worthText(w){
  const n=w===0?"":`Bisher ${w===1?"1 Fehlversuch":w+" Fehlversuche"}. `;
  return n+`Diese Frage bringt jetzt noch ${pl(worth(w))}.`;
}

/* ---------- Richtig ---------- */
function renderOk(){
  const q=QUESTIONS[state.idx];
  const p=state.pts[q.id];
  const last=state.idx===QUESTIONS.length-1;
  if(state.finished && !last){state.idx++;state.view="q";save();return renderEnd();}
  app.innerHTML=`
    <h2 class="script">Richtig!</h2>
    <p class="msg ok" role="status">Frage ${esc(q.id)} gelöst: +${pl(p)}</p>
    ${q.after?`<div class="quote">${esc(q.after)}</div>`:""}
    <button class="btn full" id="next">${last?"Zum Ergebnis":"Weiter zur nächsten Frage"}</button>`;
  document.getElementById("next").onclick=()=>{state.idx++;state.view="q";save();render();window.scrollTo(0,0)};
  document.getElementById("next").focus();
}

/* ---------- Ende ---------- */
function renderEnd(){
  if(!state.finished) finish(false);
  updateBar();
  const t=total();
  const used=mmss(new Date(state.finished)-new Date(state.started));
  const answered=Object.keys(state.pts).length;
  const fmt=d=>d?new Date(d).toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"}):"–";
  app.innerHTML=`
    <h2 class="script">${state.timeUp?"Zeit ist um!":"Geschafft!"}</h2>
    ${state.timeUp?`<p class="msg bad" role="alert">Die 60 Minuten sind abgelaufen. Ihr habt ${answered} von ${QUESTIONS.length} Fragen geschafft.</p>`:""}
    <p><b>${esc(state.team.name)}</b> hat erreicht:</p>
    <div class="score">${t}</div>
    <p class="sub">von ${MAX} möglichen Punkten</p>
    <p style="font-size:20px;margin:6px 0 4px"><b>Benötigte Zeit: ${used} Min.</b></p>
    <p class="sub">Start ${fmt(state.started)} Uhr, Ende ${fmt(state.finished)} Uhr · bei Punktgleichstand entscheidet die Zeit</p>
    <p>Zeigt diesen Bildschirm bei der Weihnachtsfeier vor.</p>
    <table class="res"><tbody>
      ${QUESTIONS.map(q=>`<tr><td>Frage ${esc(q.id)}${state.skipped[q.id]?" (übersprungen)":(q.id in state.pts?"":" (nicht erreicht)")}</td><td>${state.pts[q.id]??0}</td></tr>`).join("")}
    </tbody></table>
    <div class="navyband">Frohe Weihnachten und danke fürs Mitmachen!</div>`;
}

/* ---------- Zurücksetzen nur mit Orga-PIN ---------- */
const foot=document.createElement("div");
foot.className="wrap"; foot.style.paddingTop="0";
foot.innerHTML='<button class="link" id="reset">Für die Orga: Rallye zurücksetzen</button>';
document.body.appendChild(foot);
document.getElementById("reset").onclick=async()=>{
  const pin=prompt("Orga-PIN eingeben, um den Spielstand auf diesem Handy zu löschen:");
  if(pin===null) return;
  if(await sha(SALT+"pin|"+pin.trim())===PIN_HASH){
    state=fresh(); save(); render(); window.scrollTo(0,0);
  }else alert("PIN falsch. Der Spielstand bleibt erhalten.");
};

render();
</script>
</body>
</html>
